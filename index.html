<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Play</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f0f12">
<meta name="description" content="Who's playing near you today, with a sample of their music.">
<style>
  :root {
    --bg: #0f0f12; --card: #1a1a20; --line: #2a2a33; --text: #f2f2f5;
    --muted: #9a9aa8; --accent: #ff5a5f; --accent-2: #ffb347; --ok: #4cd18a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 96px; }
  header h1 { margin: 0; font-size: 2.2rem; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  .date { color: var(--muted); margin: 4px 0 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select {
    flex: 1 1 180px; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #111116; color: var(--text); font-size: 1rem;
  }
  select { flex: 0 0 auto; }
  button {
    padding: 12px 16px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600;
    font-size: 1rem; background: var(--accent); color: #fff;
  }
  button.secondary { background: #2a2a33; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .daterow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .daterow label { margin: 0; white-space: nowrap; font-size: 1rem; color: var(--text); }
  .daterow input { flex: 1 1 auto; color-scheme: dark; }
  .daterow button { padding: 12px 14px; }
  .or { text-align: center; color: var(--muted); font-size: .85rem; margin: 12px 0; }
  a { color: var(--accent-2); }
  #status { margin: 18px 2px; color: var(--muted); min-height: 1.4em; }
  #status.error { color: var(--accent); }
  .list { display: grid; gap: 10px; }
  .act {
    display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
  }
  .act img, .act .ph { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #23232b; }
  .act .name { font-weight: 700; }
  .act .meta { color: var(--muted); font-size: .85rem; }
  .act .meta a { color: var(--muted); }
  .act .track { font-size: .8rem; color: var(--ok); margin-top: 2px; }
  .act .track.none { color: var(--muted); }
  .lineup { margin-top: 6px; display: grid; gap: 2px; }
  .lineup .who { font-size: .9rem; padding: 2px 0; }
  a.tix { color: inherit; text-decoration: underline; text-decoration-color: #55556a; text-underline-offset: 3px; }
  .lineup .who.on a.tix { color: var(--ok); }
  .lineup .who .role { color: var(--muted); font-size: .75rem; margin-left: 6px; }
  .lineup .who.on { color: var(--ok); }
  .lineup .who .trk { display: block; font-size: .78rem; color: var(--ok); }
  .lineup .who .trk.none { color: var(--muted); }
  .play {
    width: 48px; height: 48px; border-radius: 50%; padding: 0; font-size: 1.1rem;
    display: grid; place-items: center;
  }
  .play.playing { background: var(--ok); }
  .controls { display: grid; gap: 8px; justify-items: center; }
  .play.skip { width: 40px; height: 40px; font-size: .95rem; background: #2a2a33; color: var(--text); }
  .play[hidden] { display: none; }
  .play:disabled { background: #2a2a33; color: #5a5a66; opacity: 1; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); }
  footer { color: var(--muted); font-size: .8rem; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Today's <span>Play</span></h1>
    <div class="date" id="today"></div>
  </header>

  <div class="panel">
    <div class="daterow">
      <label for="day">📅 Date</label>
      <input type="date" id="day">
      <button type="button" id="todayBtn" class="secondary">Today</button>
    </div>
    <button id="nearMe" style="width:100%">📍 Who's playing near me</button>
    <div class="or">or search a place</div>
    <form id="searchForm" class="row">
      <input id="place" placeholder="City, state or ZIP (e.g. Davis, CA)" autocomplete="off">
      <select id="radius" aria-label="Radius">
        <option value="10">10 mi</option>
        <option value="25" selected>25 mi</option>
        <option value="50">50 mi</option>
      </select>
      <button type="submit">Go</button>
    </form>
  </div>

  <div id="status"></div>
  <div id="results" class="list"></div>

  <footer>
    Shows from the Ticketmaster Discovery API. 30-second samples from Deezer and iTunes.
  </footer>
</div>

<audio id="player" preload="none"></audio>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), resultsEl = $("results"), player = $("player");

  // ---------- storage (may be unavailable) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  // ---------- date ----------
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const toYmd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayYmd = toYmd(now);
  const dayInput = $("day");
  dayInput.value = todayYmd;
  dayInput.min = todayYmd;
  const ymd = () => dayInput.value || todayYmd;
  const isToday = () => ymd() === todayYmd;
  const dayLabel = () => {
    const [y, m, d] = ymd().split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  };
  const whenText = () => isToday() ? "today" : `on ${dayLabel()}`;
  const showDate = () => { $("today").textContent = dayLabel(); };
  showDate();
  let lastSearch = null; // re-run the last search when the date changes
  dayInput.addEventListener("change", () => { showDate(); if (lastSearch) lastSearch(); });
  $("todayBtn").addEventListener("click", () => { dayInput.value = todayYmd; showDate(); if (lastSearch) lastSearch(); });

  // ---------- API key ----------
  const TM_KEY = "uFdFU8rGqFvKCkO5Jurt2VUNq9H1Wcsx";
  try { localStorage.removeItem("tmKey"); } catch {}

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  // ---------- geohash (Ticketmaster geoPoint) ----------
  function geohash(lat, lon, precision = 9) {
    const base32 = "0123456789bcdefghjkmnpqrstuvwxyz";
    let latR = [-90, 90], lonR = [-180, 180], hash = "", bit = 0, ch = 0, even = true;
    while (hash.length < precision) {
      const r = even ? lonR : latR, v = even ? lon : lat, mid = (r[0] + r[1]) / 2;
      if (v >= mid) { ch = (ch << 1) | 1; r[0] = mid; } else { ch = ch << 1; r[1] = mid; }
      even = !even;
      if (++bit === 5) { hash += base32[ch]; bit = 0; ch = 0; }
    }
    return hash;
  }

  // ---------- Ticketmaster ----------
  async function fetchShows(locParams) {
    const key = TM_KEY;
    const p = new URLSearchParams({
      apikey: key,
      classificationName: "music",
      localStartDateTime: `${ymd()}T00:00:00,${ymd()}T23:59:59`,
      sort: "date,asc",
      size: "100",
      ...locParams
    });
    const res = await fetch(`https://app.ticketmaster.com/discovery/v2/events.json?${p}`);
    if (res.status === 401) throw new Error("Show listings are unavailable right now. Please try again later.");
    if (res.status === 429) throw new Error("Ticketmaster rate limit hit. Wait a minute and try again.");
    if (!res.ok) throw new Error(`Ticketmaster error (${res.status}).`);
    const data = await res.json();
    return (data._embedded && data._embedded.events) || [];
  }

  // One row per artist; headliners first, openers after, deduped across events.
  // One card per show: headliner first, then the warm-up acts, in Ticketmaster's billing order.
  function toShows(events) {
    const shows = new Map();
    for (const ev of events) {
      const venue = ev._embedded?.venues?.[0];
      const attractions = ev._embedded?.attractions || [];
      const acts = (attractions.length ? attractions.map(a => ({ name: a.name, img: pickImage(a.images) }))
                                       : [{ name: ev.name, img: null }]).filter(a => norm(a.name));
      if (!acts.length) continue;
      const time = ev.dates?.start?.localTime || "";
      // Ticketmaster often lists the same show more than once (VIP packages, parking, etc.).
      const key = [acts.map(a => norm(a.name)).join("|"), norm(venue?.name), time].join("#");
      if (shows.has(key)) continue;
      shows.set(key, {
        acts,
        image: acts[0].img || pickImage(ev.images),
        venue: venue?.name || "",
        city: venue?.city?.name || "",
        time,
        url: ev.url || ""
      });
    }
    return [...shows.values()].sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
  }

  function pickImage(imgs) {
    if (!imgs || !imgs.length) return null;
    const sq = imgs.filter(i => i.ratio === "1_1" || i.ratio === "4_3");
    const pool = sq.length ? sq : imgs;
    return pool.slice().sort((a, b) => a.width - b.width).find(i => i.width >= 120)?.url || pool[0].url;
  }

  const norm = (s) => (s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
                                .replace(/^the\s+/, "").replace(/[^a-z0-9]/g, "");

  function fmtTime(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  // ---------- song samples (JSONP: works without CORS) ----------
  let jsonpId = 0;
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = `__jsonp_cb_${++jsonpId}`;
      const s = document.createElement("script");
      const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 10000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = (data) => { cleanup(); resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error("network")); };
      s.src = `${url}&callback=${cb}`;
      document.head.appendChild(s);
    });
  }

  const TOP_N = 5;

  // Deezer: the artist's real top tracks, ranked by popularity.
  async function deezerTop(artist) {
    const k = norm(artist);
    const q = new URLSearchParams({ q: artist, limit: "10", output: "jsonp" });
    const found = await jsonp(`https://api.deezer.com/search/artist?${q}`);
    // Only accept an exact artist-name match, so we never play the wrong band.
    const matches = (found.data || []).filter(a => norm(a.name) === k)
                                      .sort((a, b) => (b.nb_fan || 0) - (a.nb_fan || 0));
    if (!matches.length) return [];
    const top = await jsonp(`https://api.deezer.com/artist/${matches[0].id}/top?limit=10&output=jsonp`);
    return (top.data || []).filter(t => t.preview)
                           .map(t => ({ url: t.preview, title: t.title_short || t.title }));
  }

  // iTunes fallback for bands Deezer doesn't have (search order, not a true top list).
  async function itunesTracks(artist) {
    const k = norm(artist);
    const q = new URLSearchParams({ term: artist, entity: "song", attribute: "artistTerm", limit: "25", country: "US" });
    const data = await jsonp(`https://itunes.apple.com/search?${q}`);
    return (data.results || []).filter(r => r.previewUrl && norm(r.artistName) === k)
                               .map(r => ({ url: r.previewUrl, title: r.trackName }));
  }

  // Try a lookup twice before giving up: a slow or dropped request shouldn't mean "no music".
  async function tryTwice(fn) {
    try { return { list: await fn(), ok: true }; } catch {}
    await new Promise(r => setTimeout(r, 800));
    try { return { list: await fn(), ok: true }; } catch { return { list: [], ok: false }; }
  }

  // One shared lookup per band (so the background loader and the play button never duplicate work).
  const tracksCache = new Map();
  function findTracks(artist) {
    const k = norm(artist);
    if (tracksCache.has(k)) return tracksCache.get(k);
    const p = (async () => {
      let r = await tryTwice(() => deezerTop(artist));
      let list = r.list, ok = r.ok;
      if (!list.length) { const r2 = await tryTwice(() => itunesTracks(artist)); list = r2.list; ok = ok || r2.ok; }
      // Drop repeats of the same song (live versions, remasters listed twice, etc.).
      const seen = new Set();
      list = list.filter(t => { const n = norm(t.title.replace(/\s*[\(\[].*$/, "")); if (seen.has(n)) return false; seen.add(n); return true; })
                 .slice(0, TOP_N);
      // Network trouble on both services: don't remember the empty answer, so the next try looks again.
      if (!list.length && !ok) tracksCache.delete(k);
      return list;
    })();
    tracksCache.set(k, p);
    return p;
  }

  // ---------- background loader: fetch every band's songs as soon as results appear ----------
  let prefetchGen = 0;
  function prefetch(shows) {
    const gen = ++prefetchGen;
    const names = [];
    const seen = new Set();
    for (const show of shows) for (const a of show.acts) {
      const k = norm(a.name);
      if (!seen.has(k)) { seen.add(k); names.push(a.name); }
    }
    let next = 0;
    async function worker() {
      while (gen === prefetchGen && next < names.length) {
        const name = names[next++];
        const list = await findTracks(name);
        if (gen !== prefetchGen) return;
        markBand(name, list);
      }
    }
    // A few at a time keeps well under Deezer's rate limit.
    for (let i = 0; i < 3; i++) worker();
  }

  // Show which bands have no samples, and disable ▶ on shows with nothing to play.
  function markBand(name, list) {
    const k = norm(name);
    resultsEl.querySelectorAll(".who").forEach(line => {
      if (line.dataset.band !== k) return;
      line.dataset.state = list.length ? "ready" : "none";
      const trk = line.querySelector(".trk");
      if (!list.length && !line.classList.contains("on")) { trk.className = "trk none"; trk.textContent = "No samples available"; }
      const card = line.closest(".act");
      const lines = [...card.querySelectorAll(".who")];
      if (lines.every(l => l.dataset.state === "none")) {
        const btn = card.querySelector(".play:not(.skip)");
        btn.disabled = true; btn.title = "No samples available for this show"; card.classList.add("silent");
      }
    });
  }

  // ---------- playback: each show's lineup is a playlist ----------
  // now_ = { card, btn, skip, acts, lines, band, track, tracks, token }
  let now_ = null;
  let tokenSeq = 0;

  function stopCurrent() {
    ++tokenSeq;
    player.pause();
    if (now_) {
      now_.btn.textContent = "▶"; now_.btn.classList.remove("playing");
      now_.skip.hidden = true;
      now_.lines.forEach(l => l.classList.remove("on"));
      const bar = now_.card.querySelector(".bar i"); if (bar) bar.style.width = "0";
    }
    now_ = null;
  }
  player.addEventListener("timeupdate", () => {
    if (!now_ || !player.duration) return;
    const bar = now_.card.querySelector(".bar i");
    if (bar) bar.style.width = `${(player.currentTime / player.duration) * 100}%`;
  });
  player.addEventListener("ended", () => { if (now_) nextTrack(); });

  function startShow(card, btn, skip, acts, lines, startBand = 0) {
    stopCurrent();
    now_ = { card, btn, skip, acts, lines, band: -1, track: 0, tracks: [], token: 0 };
    btn.textContent = "❚❚"; btn.classList.add("playing");
    skip.hidden = false;
    playBand(startBand);
  }

  function nextTrack() {
    if (!now_) return;
    if (now_.track + 1 < now_.tracks.length) playTrack(now_.track + 1);
    else playBand(now_.band + 1);
  }

  async function playBand(i) {
    const st = now_;
    if (!st) return;
    if (i >= st.acts.length) { stopCurrent(); return; }
    const token = ++tokenSeq;
    st.band = i; st.token = token; st.tracks = []; st.track = 0;
    st.lines.forEach((l, j) => l.classList.toggle("on", j === i));
    const trk = st.lines[i].querySelector(".trk");
    trk.className = "trk"; trk.textContent = "Finding songs…";
    let list = [];
    try { list = await findTracks(st.acts[i].name); } catch {}
    markBand(st.acts[i].name, list);
    if (now_ !== st || st.token !== token) return; // user moved on
    if (!list.length) {
      trk.textContent = "No samples found"; trk.classList.add("none");
      playBand(i + 1);
      return;
    }
    st.tracks = list;
    playTrack(0);
  }

  async function playTrack(t) {
    const st = now_;
    if (!st) return;
    const token = ++tokenSeq;
    st.track = t; st.token = token;
    const song = st.tracks[t];
    const trk = st.lines[st.band].querySelector(".trk");
    trk.className = "trk";
    trk.textContent = `♪ ${song.title} (${t + 1} of ${st.tracks.length})`;
    const bar = st.card.querySelector(".bar i"); if (bar) bar.style.width = "0";
    player.src = song.url;
    try { await player.play(); }
    catch {
      if (now_ !== st || st.token !== token) return;
      nextTrack(); // a dead preview link: move on
    }
  }

  // ---------- render ----------
  function render(shows, where) {
    resultsEl.innerHTML = "";
    if (!shows.length) {
      setStatus(`No music listed on Ticketmaster ${where} ${whenText()}. Try a bigger radius or a nearby city.`);
      return;
    }
    setStatus(`${shows.length} show${shows.length === 1 ? "" : "s"} ${where} ${whenText()}. Tap ▶ to hear each band's top songs, or a band's name for tickets.`);
    for (const show of shows) {
      const card = document.createElement("div");
      card.className = "act";

      const img = document.createElement(show.image ? "img" : "div");
      if (show.image) { img.src = show.image; img.alt = ""; img.loading = "lazy"; } else img.className = "ph";

      const info = document.createElement("div");
      // Band names link to the show's Ticketmaster page.
      const ticketLink = (text) => {
        if (!show.url) return document.createTextNode(text);
        const a = document.createElement("a");
        a.href = show.url; a.target = "_blank"; a.rel = "noopener"; a.className = "tix";
        a.textContent = text; a.title = `Tickets for ${show.acts[0].name}`;
        return a;
      };
      const name = document.createElement("div"); name.className = "name";
      name.appendChild(ticketLink(show.acts[0].name));
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = [show.venue, show.city, fmtTime(show.time)].filter(Boolean).join(" · ");

      const lineup = document.createElement("div"); lineup.className = "lineup";
      const btn = document.createElement("button");
      const skip = document.createElement("button");
      const lines = show.acts.map((act, i) => {
        const line = document.createElement("div"); line.className = "who";
        line.dataset.band = norm(act.name);
        line.append(ticketLink(act.name));
        const role = document.createElement("span"); role.className = "role";
        role.textContent = show.acts.length === 1 ? "" : (i === 0 ? "headliner" : "warm-up");
        const trk = document.createElement("span"); trk.className = "trk";
        line.append(role, trk);
        lineup.appendChild(line);
        return line;
      });
      const bar = document.createElement("div"); bar.className = "bar"; bar.appendChild(document.createElement("i"));
      info.append(name, meta, lineup, bar);

      btn.className = "play"; btn.textContent = "▶";
      btn.setAttribute("aria-label", `Play the lineup for ${show.acts[0].name}`);
      btn.addEventListener("click", () => {
        if (now_ && now_.btn === btn) stopCurrent();
        else startShow(card, btn, skip, show.acts, lines, 0);
      });

      skip.className = "play skip"; skip.textContent = "⏭"; skip.hidden = true;
      skip.setAttribute("aria-label", "Skip to the next song");
      skip.addEventListener("click", () => { if (now_ && now_.skip === skip) nextTrack(); });

      const controls = document.createElement("div"); controls.className = "controls";
      controls.append(btn, skip);
      card.append(img, info, controls);
      resultsEl.appendChild(card);
    }
    prefetch(shows);
  }

  async function run(locParams, where) {
    lastSearch = () => run(locParams, where);
    stopCurrent();
    resultsEl.innerHTML = "";
    setStatus("Looking up shows…");
    try {
      const events = await fetchShows(locParams);
      render(toShows(events), where);
    } catch (e) {
      setStatus(e.message || "Something went wrong.", true);
    }
  }

  // Ticketmaster's postalCode filter only matches venues inside that exact ZIP,
  // so turn the ZIP into coordinates and do a radius search around it.
  async function searchZip(zip, radius) {
    setStatus("Looking up shows…");
    let geo = null;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      const res = await fetch(`https://api.zippopotam.us/us/${zip}`, { signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) {
        const pl = (await res.json()).places?.[0];
        if (pl) geo = { lat: parseFloat(pl.latitude), lon: parseFloat(pl.longitude), name: pl["place name"] };
      }
    } catch {}
    if (geo && isFinite(geo.lat) && isFinite(geo.lon)) {
      run({ geoPoint: geohash(geo.lat, geo.lon), radius, unit: "miles" }, `within ${radius} mi of ${geo.name || zip}`);
    } else {
      // Fallback: exact-ZIP match only.
      run({ postalCode: zip }, `in ZIP ${zip}`);
    }
  }

  // ---------- inputs ----------
  $("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const place = $("place").value.trim();
    if (!place) { setStatus("Type a city or ZIP code.", true); return; }
    store.set("lastPlace", place);
    const radius = $("radius").value;
    if (/^\d{5}$/.test(place)) searchZip(place, radius);
    else searchCity(place, radius);
  });

  // Ticketmaster's city filter only matches venues in that exact city, so geocode the
  // city (Open-Meteo, free, no key) and do a radius search around it.
  const STATES = { AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",
    DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",
    IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",
    MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",
    NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",
    OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",
    UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming" };

  async function searchCity(place, radius) {
    setStatus("Looking up shows…");
    const [city, stateRaw] = place.split(",").map(s => s.trim());
    let state = (stateRaw || "").toLowerCase();
    if (STATES[state.toUpperCase()]) state = STATES[state.toUpperCase()].toLowerCase();
    let geo = null;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      const q = new URLSearchParams({ name: city, count: "20", language: "en", format: "json", countryCode: "US" });
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${q}`, { signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) {
        let hits = ((await res.json()).results || []).filter(r => r.country_code === "US");
        if (state) hits = hits.filter(r => (r.admin1 || "").toLowerCase() === state);
        // No state given: take the biggest place with that name (Davis -> Davis, CA).
        hits.sort((a, b) => (b.population || 0) - (a.population || 0));
        const h = hits[0];
        if (h) geo = { lat: h.latitude, lon: h.longitude, name: `${h.name}${h.admin1 ? ", " + h.admin1 : ""}` };
      }
    } catch {}
    if (geo && isFinite(geo.lat) && isFinite(geo.lon)) {
      run({ geoPoint: geohash(geo.lat, geo.lon), radius, unit: "miles" }, `within ${radius} mi of ${geo.name}`);
    } else {
      // Fallback: exact-city match only.
      const p = { city };
      if (stateRaw && /^[A-Za-z]{2}$/.test(stateRaw)) p.stateCode = stateRaw.toUpperCase();
      run(p, `in ${city}`);
    }
  }

  $("nearMe").addEventListener("click", () => {
    if (!navigator.geolocation) { setStatus("Location isn't available in this browser. Search a city instead.", true); return; }
    setStatus("Finding you…");
    navigator.geolocation.getCurrentPosition(
      (pos) => run({ geoPoint: geohash(pos.coords.latitude, pos.coords.longitude), radius: $("radius").value, unit: "miles" }, "near you"),
      () => setStatus("Couldn't get your location. Search a city or ZIP instead.", true),
      { timeout: 10000, maximumAge: 600000 }
    );
  });

  const last = store.get("lastPlace");
  if (last) $("place").value = last;
})();
</script>
</body>
